name: Türkçe dublaj

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Doğrudan MP4 bağlantısı (yalnızca hakkına sahip olduğun videolar)"
        required: true
      source_lang:
        description: "Kaynak dil kodu (ör. en). Boş = otomatik algıla"
        required: false
        default: ""
      whisper_model:
        description: "Yazıya dökme modeli (büyük = daha doğru, daha yavaş)"
        type: choice
        options: [small, base, medium]
        default: small
      tts:
        description: "Seslendirme: edge (ücretsiz) veya openai (ücretli)"
        type: choice
        options: [edge, openai]
        default: edge
      voice:
        description: "Ses (edge: tr-TR-AhmetNeural / tr-TR-EmelNeural, openai: onyx...)"
        required: false
        default: ""
      original_volume:
        description: "Arka plandaki orijinal ses seviyesi (0 = tamamen kapalı)"
        required: false
        default: "0.12"
      burn_subtitles:
        description: "Türkçe altyazıyı görüntüye göm"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dub:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-dub.txt
      - name: Cache Whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ inputs.whisper_model }}-v1
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Dub video
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DUB_LLM_API_KEY: ${{ secrets.DUB_LLM_API_KEY }}
          DUB_LLM_BASE_URL: ${{ vars.DUB_LLM_BASE_URL }}
          DUB_LLM_MODEL: ${{ vars.DUB_LLM_MODEL }}
          SOURCE_URL: ${{ inputs.source_url }}
          DUB_SOURCE_LANG: ${{ inputs.source_lang }}
          DUB_WHISPER_MODEL: ${{ inputs.whisper_model }}
          DUB_TTS: ${{ inputs.tts }}
          DUB_VOICE: ${{ inputs.voice }}
          DUB_ORIGINAL_VOLUME: ${{ inputs.original_volume }}
          DUB_BURN_SUBTITLES: ${{ inputs.burn_subtitles }}
        run: |
          [ -n "$DUB_LLM_BASE_URL" ] || unset DUB_LLM_BASE_URL
          [ -n "$DUB_LLM_MODEL" ] || unset DUB_LLM_MODEL
          python dub_pipeline.py "$SOURCE_URL"
      - name: Upload dubbed video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turkce-dublaj
          path: |
            output/video_dublaj.mp4
            output/dublaj_tr.srt
            output/dublaj.json
          if-no-files-found: warn
          retention-days: 3
